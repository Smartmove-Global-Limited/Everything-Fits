apply plugin: 'com.android.application'

// Release signing is read from android/keystore.properties, which stays out of
// version control. Without that file the release build still assembles — it is
// simply left unsigned — so a fresh clone is never blocked on secrets.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "everything.fits.packing.puzzle.organize"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "everything.fits.packing.puzzle.organize"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            // rootProject.file, not file: a bare path in keystore.properties reads
            // naturally as relative to that file (android/), but `file()` inside a
            // module resolves against android/app/ and the key is never found.
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // The unshrunk APK is mostly androidx/Capacitor bytecode wrapped around
            // a few hundred KB of game. R8 plus resource shrinking closes that gap.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Tên file APK lấy theo tên game. Mặc định Gradle đặt là "app-debug.apk" — file này
// được gửi tay qua chat cho người khác cài, mà cái tên đó không nói được nó là app nào,
// và ai cũng có một file trùng tên y hệt nằm sẵn trong thư mục tải về.
base {
    archivesName = "EverythingFits-v${android.defaultConfig.versionName}"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ---- Firebase (cấu hình trong app/google-services.json) ----
    // BoM giữ mọi thư viện Firebase cùng một bộ phiên bản khớp nhau, từng dòng dưới không ghi số.
    // Analytics: nền để gắn event sau này (và là nguồn dữ liệu cho AppLovin MAX / Firebase A/B).
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-analytics"

    // ---- Facebook SDK: bản core (App Events, đo lượt cài), không kéo phần đăng nhập/chia sẻ ----
    // App ID và Client Token nằm trong res/values/strings.xml, khai trong AndroidManifest.xml.
    implementation "com.facebook.android:facebook-core:$facebookSdkVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
