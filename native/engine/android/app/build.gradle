import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

// Store version: native/engine/android/version.properties (EF Android panel)
def ver = new Properties()
file('../version.properties').withInputStream { ver.load(it) }
// output files named after the version, like the web app: EverythingFits-v0.0.2-code6-release.aab
base { archivesName = "EverythingFits-v${ver['versionName']}-code${ver['versionCode']}" }
// AppLovin MAX keys from applovin.properties next to this folder (NOT in git). Missing file
// or empty sdkKey = no ad SDK started, the game shows its simulated "TEST AD" screens.
def alProps = new Properties()
def alFile = file('../applovin.properties')
if (alFile.exists()) alFile.withInputStream { alProps.load(it) }
def admobAppId = alProps.getProperty('admobAppId', '').trim()

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkPath PROP_NDK_PATH
    ndkVersion new File(PROP_NDK_PATH).name   // AGP 8.5+ checks it against the NDK folder
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion 24   // like the web app; Firebase BoM 34 needs 23+
        targetSdkVersion PROP_TARGET_SDK_VERSION
        // Store version: native/engine/android/version.properties (raise it for every upload)
        versionCode ver['versionCode'].toInteger()
        versionName ver['versionName']
        // AppsFlyer Dev Key from appsflyer.properties next to this folder (NOT in git, like the
        // web app's android/appsflyer.properties). Missing file = the app sends nothing to AppsFlyer.
        def afProps = new Properties()
        def afFile = file('../appsflyer.properties')
        if (afFile.exists()) afFile.withInputStream { afProps.load(it) }
        resValue "string", "af_dev_key", afProps.getProperty('devKey', '')
        resValue "string", "applovin_sdk_key", alProps.getProperty('sdkKey', '')
        resValue "string", "applovin_banner_unit", alProps.getProperty('bannerUnit', '')
        resValue "string", "applovin_inter_unit", alProps.getProperty('interUnit', '')
        resValue "string", "applovin_rewarded_unit", alProps.getProperty('rewardedUnit', '')
        resValue "string", "applovin_test_devices", alProps.getProperty('testDevices', '')
        resValue "bool", "ads_off", alProps.getProperty('adsOff', 'false').trim()   // adsOff=true: no banner / interstitial
        resValue "bool", "log_advertising_id", "false"   // device / debug builds: true (AdsBridge)
        // AdMob app id for the AdMob network in MAX mediation (the Google SDK stops the app without it)
        manifestPlaceholders = [admobAppId: admobAppId ?: 'ca-app-pub-3940256099942544~3347511713']

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    sourceSets.main {
        java.srcDirs "../src", "src"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    // Release signing, like the web app: keystore.properties next to this folder (NOT in git, nor
    // the .jks it names). Without it, the keystore set in the Cocos Build panel is used.
    def ksFile = file('../keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
       release {
            if (ksFile.exists()) {
                // absolute path, or relative to this folder
                def sf = new File(ks['storeFile'])
                storeFile sf.isAbsolute() ? sf : new File(ksFile.parentFile, ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            } else if (project.hasProperty("RELEASE_STORE_FILE") && !RELEASE_STORE_FILE.isEmpty()) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksFile.exists() || project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        // optimised test build (engine C++ in release, no validator) that installs next to the
        // store / web app: gradlew assemblePreview
        preview {
            initWith release
            applicationIdSuffix ".cocos"
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            getIsDefault().set(false)
        }

        // optimised build that REPLACES the app installed on a phone from Android Studio (Run =
        // debug key ~/.android/debug.keystore, same package): gradlew assembleDevice
        device {
            initWith release
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            getIsDefault().set(false)
            resValue "bool", "log_advertising_id", "true"
        }

        debug {
            // test builds install next to the store / web app instead of replacing it
            applicationIdSuffix ".cocos"
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            resValue "bool", "log_advertising_id", "true"
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    // ---- analytics, same SDKs as the web / Capacitor app ----
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.appsflyer:af-android-sdk:6.17.0'
    implementation 'com.facebook.android:facebook-core:18.3.0'
    implementation 'com.google.firebase:firebase-config'
    // ---- ads and purchases ----
    implementation 'com.applovin:applovin-sdk:13.6.4'
    // MAX mediation networks: Google AdMob (only with admobAppId in applovin.properties)
    if (admobAppId) implementation 'com.applovin.mediation:google-adapter:25.5.0.0'
    implementation 'com.android.billingclient:billing:9.1.0'   // 9.x: blocked Play Store now BILLING_UNAVAILABLE (not ERROR); targetSdk 35+ (we use 36)
    implementation project(':libcocos')
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }
}
