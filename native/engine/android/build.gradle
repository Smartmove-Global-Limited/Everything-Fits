// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
        // jcenter() // keeped as anchor, will be removed soon
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter() // keeped as anchor, will be removed soon
        // AppLovin MAX mediation networks whose SDKs are not on Maven Central (app/build.gradle)
        maven { url 'https://artifactory.bidmachine.io/bidmachine' }                                      // BidMachine
        maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }     // Mintegral
        maven { url 'https://artifact.bytedance.com/repository/pangle' }                                  // Pangle
        maven { url 'https://verve.jfrog.io/artifactory/verve-gradle-release' }                           // Verve (HyBid)
        maven { url 'https://cboost.jfrog.io/artifactory/chartboost-ads/' }                               // Chartboost
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
